<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1733"/>
      <stop offset="100%" stop-color="#1E3168"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#F97357" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F97357" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FAFAF7" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top tag -->
  <g transform="translate(80, 80)">
    <rect width="290" height="40" rx="20" fill="#FAFAF7" fill-opacity="0.1"/>
    <circle cx="22" cy="20" r="5" fill="#F97357"/>
    <text x="40" y="26" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#FAFAF7">2026 KOSDAQ AI 政策窗口</text>
  </g>

  <!-- Headline -->
  <g transform="translate(80, 180)" font-family="'Noto Sans SC', sans-serif">
    <text font-size="84" font-weight="900" fill="#FAFAF7" letter-spacing="-2">
      <tspan x="0" y="0">韩国 </tspan>
      <tspan fill="#F97357">KOSDAQ</tspan>
      <tspan x="0" dy="100">可能比纳斯达克</tspan>
      <tspan x="0" dy="100">更适合你。</tspan>
    </text>
  </g>

  <!-- Sub stats -->
  <g transform="translate(80, 540)" font-family="Inter, sans-serif">
    <text font-size="20" fill="#FAFAF7" fill-opacity="0.8">
      <tspan font-weight="700" fill="#F97357">$250M ARR</tspan>
      <tspan> · Plaud 已验证赛道  ·  </tspan>
      <tspan font-weight="700" fill="#F97357">12-18 个月</tspan>
      <tspan> 可达  ·  AI 板块 P/S </tspan>
      <tspan font-weight="700" fill="#F97357">8-15×</tspan>
    </text>
  </g>

  <!-- Right corner mark -->
  <g transform="translate(1020, 80)">
    <rect width="100" height="100" rx="20" fill="#F97357"/>
    <text x="50" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="40" font-weight="900" fill="#FAFAF7">IPO</text>
  </g>
</svg>
